<title>ZipNab Launch Control</title>
<style>
  :root {
    --paper: #f7faf8; --card: #ffffff; --ink: #16211b; --muted: #5b6b62;
    --line: #dde5df; --green: #16a34a; --green-soft: #e6f4ea; --amber: #b45309;
    --amber-soft: #fdf3e3; --locked: #96a49b; --shadow: 0 1px 3px rgba(22, 33, 27, .08);
  }
  @media (prefers-color-scheme: dark) {
    :root { --paper: #101613; --card: #18211c; --ink: #e7efe9; --muted: #93a49a;
            --line: #263129; --green: #34c268; --green-soft: #16281d; --amber: #e0a04a;
            --amber-soft: #2a2214; --locked: #5b6b62; --shadow: none; }
  }
  :root[data-theme="dark"] { --paper: #101613; --card: #18211c; --ink: #e7efe9; --muted: #93a49a;
            --line: #263129; --green: #34c268; --green-soft: #16281d; --amber: #e0a04a;
            --amber-soft: #2a2214; --locked: #5b6b62; --shadow: none; }
  :root[data-theme="light"] { --paper: #f7faf8; --card: #ffffff; --ink: #16211b; --muted: #5b6b62;
            --line: #dde5df; --green: #16a34a; --green-soft: #e6f4ea; --amber: #b45309;
            --amber-soft: #fdf3e3; --locked: #96a49b; --shadow: 0 1px 3px rgba(22,33,27,.08); }

  body { background: var(--paper); color: var(--ink); margin: 0;
         font: 15px/1.55 ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 0 16px 64px; }

  header.bar { position: sticky; top: 0; z-index: 5; background: var(--paper);
               border-bottom: 1px solid var(--line); padding: 14px 0 12px; }
  .brand { display: flex; align-items: baseline; gap: 10px; }
  .brand h1 { font-size: 19px; margin: 0; letter-spacing: -0.2px; }
  .brand h1 .nab { color: var(--green); }
  .brand .sub { color: var(--muted); font-size: 13px; }
  .meter { display: flex; align-items: center; gap: 12px; margin-top: 10px; }
  .track { flex: 1; height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
  .fill { height: 100%; background: var(--green); border-radius: 4px; transition: width .4s ease; }
  .stat { font-variant-numeric: tabular-nums; font-size: 13px; color: var(--muted); white-space: nowrap; }
  .stat b { color: var(--ink); }

  .phase { margin: 26px 0 10px; font-size: 11.5px; font-weight: 700; letter-spacing: 0.12em;
           text-transform: uppercase; color: var(--muted); }

  .task { background: var(--card); border: 1px solid var(--line); border-radius: 10px;
          margin-bottom: 10px; box-shadow: var(--shadow); overflow: hidden; }
  .task-head { display: flex; align-items: center; gap: 12px; padding: 12px 14px; }
  .idx { width: 28px; height: 28px; border-radius: 50%; flex: none; display: grid; place-items: center;
         font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums;
         background: var(--line); color: var(--muted); }
  .title { flex: 1; font-weight: 600; font-size: 14.5px; }
  .eta { font-variant-numeric: tabular-nums; font-size: 12px; color: var(--muted); white-space: nowrap; }
  .wait { display: inline-block; font-size: 11px; font-weight: 600; color: var(--amber);
          background: var(--amber-soft); border-radius: 4px; padding: 1px 7px; margin-left: 6px; }
  .body { padding: 0 14px 14px 54px; font-size: 13.5px; color: var(--muted); }
  .body a { color: var(--green); }
  .body code { font: 12px ui-monospace, monospace; background: var(--paper);
               border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; }
  button.done { margin-top: 10px; background: var(--green); color: #fff; border: 0;
                border-radius: 8px; padding: 9px 18px; font-size: 14px; font-weight: 600;
                cursor: pointer; min-height: 40px; }
  button.done:focus-visible { outline: 3px solid var(--green-soft); outline-offset: 2px; }

  .task.current { border-color: var(--green); border-width: 2px; }
  .task.current .idx { background: var(--green); color: #fff; }
  .task.complete .idx { background: var(--green-soft); color: var(--green); }
  .task.complete .title { color: var(--muted); text-decoration: line-through; text-decoration-thickness: 1px; }
  .task.complete .stamp { font-size: 12px; color: var(--green); white-space: nowrap; }
  .task.locked { opacity: 0.55; }
  .task.locked .body, .task.complete .body { display: none; }

  footer { margin-top: 30px; display: flex; justify-content: space-between; align-items: center;
           color: var(--muted); font-size: 12.5px; }
  footer button { background: none; border: 1px solid var(--line); color: var(--muted);
                  border-radius: 6px; padding: 5px 12px; cursor: pointer; font-size: 12.5px; }
  .alldone { background: var(--green-soft); border: 1px solid var(--green); color: var(--ink);
             border-radius: 10px; padding: 18px; margin-top: 16px; font-weight: 600; display: none; }
</style>

<div class="wrap">
  <header class="bar">
    <div class="brand">
      <h1>⚡ Zip<span class="nab">Nab</span> Launch Control</h1>
      <span class="sub">one task at a time · next unlocks when you mark done</span>
    </div>
    <div class="meter">
      <div class="track"><div class="fill" id="fill"></div></div>
      <span class="stat"><b id="doneCount">0</b>/<span id="totalCount"></span> · <b id="remaining"></b> active work left</span>
    </div>
  </header>

  <main id="rail"></main>
  <div class="alldone" id="allDone">🎉 All tasks complete. ZipNab is cleared for launch — the delivery corridor is yours.</div>

  <footer>
    <span>Progress saves in this browser. Amber chips = third-party wait time (not your keyboard time).</span>
    <button id="reset">Reset progress</button>
  </footer>
</div>

<script>
  const TASKS = [
    { phase: "A · Brand", title: "Approve the ZipNab brand", eta: 5,
      how: "Review <code>docs/brand/BRAND.md</code> — name rationale, logo, taglines. If ZipNab isn't it, the fallbacks (runnab.com, nabquick.com, snagzip.com) probed available too; rerun <code>node scripts/check-domains.mjs yourname</code>." },
    { phase: "A · Brand", title: "Trademark knock-out search", eta: 20,
      how: "USPTO TESS (tmsearch.uspto.gov) for “ZIPNAB” in classes 35/39/42, plus a plain Google + App Store search. Availability of the domain ≠ clearance of the mark." },
    { phase: "A · Brand", title: "Buy zipnab.com + zipnab.co", eta: 15,
      how: "~$40 total at your existing registrar (same account that holds getbriefed.to). Both probed unregistered on Jul 31 — verify live price at checkout." },

    { phase: "B · Entity & legal", title: "Ownership restructure — 51% Sompriya / 49% you", eta: 45, wait: "attorney 1–3 days",
      how: "Send <code>docs/legal/08-ownership-restructure.md</code> (+ its two templates) to your attorney and CPA. Spousal transfer is normally tax-free, but let the CPA confirm and paper it. She must hold control, not just units, for WOSB/WBE." },
    { phase: "B · Entity & legal", title: "File d/b/a “ZipNab”", eta: 30,
      how: "San Joaquin County fictitious business name (~$50 + newspaper publication). File after the ownership amendment so records show the final structure." },
    { phase: "B · Entity & legal", title: "Business bank account under the LLC", eta: 30,
      how: "Confirm or open (Chase business checking pairs well with the funding ask). New signature cards must reflect the 51/49 amendment." },
    { phase: "B · Entity & legal", title: "CDTFA seller's permit + marketplace-facilitator registration", eta: 30,
      how: "onlineservices.cdtfa.ca.gov — free. Register before the first taxable sale." },
    { phase: "B · Entity & legal", title: "City of Tracy business license", eta: 20,
      how: "~$75 on the city portal. Mountain House (county) and Stockton follow at expansion." },

    { phase: "C · Money", title: "Activate Stripe + Connect Express", eta: 20, wait: "KYC 1–2 days",
      how: "dashboard.stripe.com — EIN, bank, identity. Enable Connect Express for Runner payouts (Stripe then handles their KYC and 1099s). Add the webhook endpoint from <code>docs/08-DEPLOY-VERCEL.md</code>." },
    { phase: "C · Money", title: "Run the credentials Q&A", eta: 35,
      how: "<code>bash clinkit/server/scripts/standup-qa.sh</code> walks you item-by-item: Kroger (free, instant), Google Maps (free credit), SerpAPI (100 free searches), Walmart. Each saved key flips that provider live automatically." },
    { phase: "C · Money", title: "Chase / SBA funding meeting (optional now)", eta: 60,
      how: "Bring <code>docs/finance/business-plan-chase.pdf</code>. Realistic asks: SBA Express ≤$50k or Ink card as bridge. Stronger after 4–8 weeks of live metrics — skippable today if you're staying under $5k." },

    { phase: "D · Tech", title: "Deploy web → zipnab.getbriefed.to", eta: 15,
      how: "Same flow as palmist/daytrader: <code>npx vercel link && npx vercel --prod && npx vercel domains add zipnab.getbriefed.to</code> from <code>clinkit/web</code>. $0." },
    { phase: "D · Tech", title: "Deploy API → Fly.io", eta: 25,
      how: "<code>fly launch</code> from <code>clinkit/server</code> using <code>infra/fly.toml</code>, set JWT/ADMIN secrets, verify <code>/api/health</code>. Mock mode = fully working app, zero API spend." },
    { phase: "D · Tech", title: "Point zipnab.com at Vercel", eta: 10,
      how: "<code>npx vercel domains add zipnab.com</code> prints the DNS records; set them at the registrar. (.co → 301 redirect to .com.)" },

    { phase: "E · Safety & supply", title: "Insurance quotes: cyber + E&O + occupational-accident", eta: 30, wait: "quotes 1–3 days",
      how: "Vouch / Hiscox / Next for the bundle (bind ≤$350/mo); gig-specialty broker for the Prop 22 occupational-accident policy. Checklist: <code>docs/legal/06</code>." },
    { phase: "E · Safety & supply", title: "Background-check vendor + Runner docs flow", eta: 20,
      how: "Open a Checkr account (pay-per-check). Load the ICA + FCRA consent (from <code>docs/legal/pdf/</code>) into DocuSign/Dropbox Sign as templates." },
    { phase: "E · Safety & supply", title: "Recruit and activate 10 Runners", eta: 150, wait: "checks 1–2 days each",
      how: "Week −1 playbook in <code>docs/marketing/01</code>: FB gig groups, Craigslist, Nextdoor, Delta College. Gate: every Runner passes the <code>docs/ops/01</code> checklist. $30 first-delivery bonus." },
    { phase: "E · Safety & supply", title: "In-store price spot-check", eta: 60,
      how: "20 items, app quote vs shelf at WinCo + Walmart Tracy. Gate: ≥90% within $2. This is your truth-in-advertising backstop before real buyers." },

    { phase: "F · Launch", title: "GO LIVE — your call", eta: 5,
      how: "Flip Stripe to live keys, enable the TRACY7 credit code, post the first Nextdoor + TikTok from <code>docs/marketing/02</code>. Everything after this is the weekly ops cadence in <code>docs/ops/03</code>." },
  ];

  const KEY = "zipnab-launch-v1";
  let done = [];
  try { done = JSON.parse(localStorage.getItem(KEY) || "[]"); } catch {}
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(done)); } catch {} };

  const rail = document.getElementById("rail");
  const fmtEta = (m) => m >= 60 ? (m / 60).toFixed(1).replace(".0","") + " h" : m + " min";

  function render() {
    const current = TASKS.findIndex((_, i) => !done[i]);
    rail.innerHTML = "";
    let lastPhase = "";
    TASKS.forEach((t, i) => {
      if (t.phase !== lastPhase) {
        lastPhase = t.phase;
        const p = document.createElement("div");
        p.className = "phase"; p.textContent = t.phase;
        rail.appendChild(p);
      }
      const state = done[i] ? "complete" : i === current ? "current" : "locked";
      const el = document.createElement("section");
      el.className = "task " + state;
      el.innerHTML =
        '<div class="task-head">' +
          '<div class="idx">' + (done[i] ? "✓" : i + 1) + "</div>" +
          '<div class="title">' + t.title + "</div>" +
          (done[i]
            ? '<span class="stamp">done ' + done[i] + "</span>"
            : '<span class="eta">' + fmtEta(t.eta) + (t.wait ? '<span class="wait">+ ' + t.wait + "</span>" : "") + "</span>") +
        "</div>" +
        '<div class="body">' + t.how +
          (state === "current" ? '<br><button class="done" data-i="' + i + '">Mark done → unlock next</button>' : "") +
        "</div>";
      rail.appendChild(el);
    });
    const n = done.filter(Boolean).length;
    document.getElementById("doneCount").textContent = n;
    document.getElementById("totalCount").textContent = TASKS.length;
    document.getElementById("fill").style.width = (100 * n / TASKS.length) + "%";
    const left = TASKS.reduce((s, t, i) => s + (done[i] ? 0 : t.eta), 0);
    document.getElementById("remaining").textContent = fmtEta(left);
    document.getElementById("allDone").style.display = n === TASKS.length ? "block" : "none";
    const btn = rail.querySelector("button.done");
    if (btn) btn.onclick = () => {
      done[+btn.dataset.i] = new Date().toLocaleDateString(undefined, { month: "short", day: "numeric" });
      save(); render();
      const cur = rail.querySelector(".task.current");
      if (cur) cur.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "center" });
    };
  }
  document.getElementById("reset").onclick = () => {
    if (confirm("Clear all progress?")) { done = []; save(); render(); }
  };
  render();
</script>
