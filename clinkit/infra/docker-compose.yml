services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: clinkit
      POSTGRES_PASSWORD: clinkit
      POSTGRES_DB: clinkit
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
volumes:
  pgdata:
